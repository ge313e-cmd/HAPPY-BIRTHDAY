<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Happy Birthday</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #14050b; overflow: hidden; }
  canvas { display: block; touch-action: none; -webkit-touch-callout: none; user-select: none; }
  .hint { position: fixed; top: 7vh; left: 0; right: 0; text-align: center; padding: 0 1rem;
          font-family: Georgia, "Times New Roman", serif; font-size: .95rem; letter-spacing: .22em;
          color: #d9a3b4; opacity: .7; pointer-events: none; transition: opacity .6s; }
  .card { position: fixed; left: 50%; top: 40%; width: min(340px, 88vw); max-height: 80vh; overflow-y: auto; padding: 1.5rem 1.3rem 1.2rem;
          background: #fff7ef; color: #3a2a2f; text-align: center; border-radius: 6px;
          font-family: Georgia, "Times New Roman", serif;
          box-shadow: 0 0 60px rgba(255,80,120,.35), 0 14px 40px rgba(0,0,0,.6);
          opacity: 0; pointer-events: none; transform: translate(-50%,-50%) scale(.2) rotate(-6deg);
          transition: transform .7s cubic-bezier(.2,1.3,.4,1), opacity .35s; will-change: transform, opacity; }
  .card.show { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1) rotate(-2deg); }
  .card h1 { font-size: 1.9rem; color: #e0246f; line-height: 1.1; margin-bottom: .6rem; }
  .card p { font-size: 1.02rem; line-height: 1.5; white-space: pre-line; }
  .card .sig { margin-top: .8rem; font-style: italic; color: #7a5560; }
  .card button { margin-top: 1rem; font: inherit; font-size: .9rem; color: #7a5560; background: none;
                 border: 1px solid #d9b9c2; border-radius: 99px; padding: .3rem 1rem; cursor: pointer; }

  .card { z-index: 30; }
  .cake-layer { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: .5rem; padding: 1rem; background: rgba(20,5,11,.8); opacity: 0; pointer-events: none; transition: opacity .4s;
                font-family: Georgia, "Times New Roman", serif; color: #ffe3ec; text-align: center; }
  .cake-layer.show { opacity: 1; pointer-events: auto; }
  .cake-layer.fade { opacity: 0; }
  .cake-wrap { width: min(280px, 72vw); transform: translateY(-120vh); will-change: transform; }
  .cake-layer.show .cake-wrap { animation: drop 1.4s forwards; }
  .cake-layer .cake-wrap.away { animation: away .5s ease-in forwards; }
  @keyframes drop {
    0%   { transform: translateY(-120vh) rotate(-5deg); animation-timing-function: cubic-bezier(.5,0,.9,.6); }
    55%  { transform: translateY(0) rotate(0); animation-timing-function: ease-out; }
    70%  { transform: translateY(-34px); animation-timing-function: ease-in; }
    82%  { transform: translateY(0); animation-timing-function: ease-out; }
    91%  { transform: translateY(-10px); animation-timing-function: ease-in; }
    100% { transform: translateY(0); }
  }
  @keyframes away { to { transform: translateY(40px) scale(.7); opacity: 0; } }
  .cake-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cake-text { font-size: 1.6rem; min-height: 2rem; }
  .cake-sub { font-size: .95rem; opacity: .75; min-height: 1.3rem; max-width: 300px; }
  .cake-skip { font: inherit; font-size: .9rem; color: #ffe3ec; background: none; border: 1px solid rgba(255,227,236,.5);
               border-radius: 99px; padding: .4rem 1.1rem; cursor: pointer; margin-top: .4rem; }
  .cake-skip[hidden], .meter[hidden] { display: none; }
  .meter { width: 180px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #ff8fb1; }

  .lean  { transform: rotate(calc(var(--lean, 0) * -30deg)) scale(1, calc(1 - var(--lean, 0) * .35)); }
  .flame { transform: scale(0); }
  .lit .flame { animation: ignite .5s ease-out forwards, flick .35s .5s infinite ease-in-out; }
  .out .flame { animation: snuff .25s ease-in forwards; }
  @keyframes ignite { from { transform: scale(0); } 60% { transform: scale(1.25); } to { transform: scale(1); } }
  @keyframes flick { 0%,100% { transform: scale(1,1); } 25% { transform: scale(.94,1.07) rotate(-2deg); } 50% { transform: scale(1.05,.95) rotate(2deg); } 75% { transform: scale(.97,1.04) rotate(-1deg); } }
  @keyframes snuff { to { transform: scale(0); } }
  .puff { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .out .puff { animation: puff 1.3s ease-out forwards; }
  .out .puff.b { animation-delay: .15s; }
  @keyframes puff { 0% { opacity: .7; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-46px) scale(2.6); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="song" src="birthday-song.mp3" preload="auto" playsinline></audio>
<p class="hint" id="hint">✿ Click anywhere to plant a flower ✿</p>

<div class="cake-layer" id="cakeLayer" aria-live="polite">
  <div class="cake-wrap" id="cakeWrap">
    <svg id="cake" viewBox="0 0 240 230" role="img" aria-label="Birthday cake with lit candles">
      <defs>
        <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffe680"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="rgba(255,200,90,.55)"/><stop offset="1" stop-color="rgba(255,200,90,0)"/></radialGradient>
      </defs>
      <ellipse cx="120" cy="212" rx="112" ry="12" fill="#efe3e8"/>
      <rect x="28" y="138" width="184" height="72" rx="12" fill="#7a4030"/>
      <path d="M28 150 Q28 138 40 138 H200 Q212 138 212 150 V158 Q200 158 196 168 Q192 178 184 168 Q176 158 160 160 Q152 170 144 160 Q136 150 120 158 Q104 168 96 158 Q88 150 76 160 Q68 172 60 160 Q50 150 40 160 Q32 162 28 156 Z" fill="#ff8fb1"/>
      <g fill="#ffd45e"><rect x="48" y="184" width="6" height="3" rx="1.5" transform="rotate(20 48 184)"/><rect x="92" y="192" width="6" height="3" rx="1.5" transform="rotate(-30 92 192)"/><rect x="150" y="186" width="6" height="3" rx="1.5" transform="rotate(40 150 186)"/><rect x="190" y="194" width="6" height="3" rx="1.5" transform="rotate(-15 190 194)"/></g>
      <g fill="#7fd6c2"><rect x="70" y="180" width="6" height="3" rx="1.5" transform="rotate(-20 70 180)"/><rect x="122" y="184" width="6" height="3" rx="1.5" transform="rotate(25 122 184)"/><rect x="172" y="178" width="6" height="3" rx="1.5" transform="rotate(-35 172 178)"/></g>
      <rect x="56" y="92" width="128" height="50" rx="12" fill="#ffe0ea"/>
      <rect x="92" y="54" width="8" height="42" rx="2" fill="#fff7ef"/><path d="M92 62 L100 58 M92 72 L100 68 M92 82 L100 78" stroke="#ff8fb1" stroke-width="3"/><line x1="96" y1="54" x2="96" y2="48" stroke="#3a2a2f" stroke-width="1.6"/><rect x="116" y="54" width="8" height="42" rx="2" fill="#fff7ef"/><path d="M116 62 L124 58 M116 72 L124 68 M116 82 L124 78" stroke="#ff8fb1" stroke-width="3"/><line x1="120" y1="54" x2="120" y2="48" stroke="#3a2a2f" stroke-width="1.6"/><rect x="140" y="54" width="8" height="42" rx="2" fill="#fff7ef"/><path d="M140 62 L148 58 M140 72 L148 68 M140 82 L148 78" stroke="#ff8fb1" stroke-width="3"/><line x1="144" y1="54" x2="144" y2="48" stroke="#3a2a2f" stroke-width="1.6"/>
      <path d="M56 104 Q56 92 68 92 H172 Q184 92 184 104 V110 Q172 112 168 122 Q164 130 156 122 Q148 112 132 116 Q120 126 112 116 Q100 110 90 118 Q80 128 72 118 Q64 110 56 112 Z" fill="#ff8fb1"/>
      <g transform="translate(96 48)"><g class="lean"><g class="flame" style="animation-delay:0s,0.55s">
        <circle cx="0" cy="-14" r="26" fill="url(#glow)"/>
        <path d="M0 0 C-8 -9 -5 -20 0 -32 C5 -20 8 -9 0 0Z" fill="url(#fl)"/>
        <path d="M0 -1 C-3 -6 -2 -11 0 -16 C2 -11 3 -6 0 -1Z" fill="#fffbe0"/></g></g>
        <circle class="puff a" cx="0" cy="-8" r="5" fill="#d9cdd3"/><circle class="puff b" cx="3" cy="-8" r="4" fill="#d9cdd3"/></g><g transform="translate(120 48)"><g class="lean"><g class="flame" style="animation-delay:0s,0.62s">
        <circle cx="0" cy="-14" r="26" fill="url(#glow)"/>
        <path d="M0 0 C-8 -9 -5 -20 0 -32 C5 -20 8 -9 0 0Z" fill="url(#fl)"/>
        <path d="M0 -1 C-3 -6 -2 -11 0 -16 C2 -11 3 -6 0 -1Z" fill="#fffbe0"/></g></g>
        <circle class="puff a" cx="0" cy="-8" r="5" fill="#d9cdd3"/><circle class="puff b" cx="3" cy="-8" r="4" fill="#d9cdd3"/></g><g transform="translate(144 48)"><g class="lean"><g class="flame" style="animation-delay:0s,0.7s">
        <circle cx="0" cy="-14" r="26" fill="url(#glow)"/>
        <path d="M0 0 C-8 -9 -5 -20 0 -32 C5 -20 8 -9 0 0Z" fill="url(#fl)"/>
        <path d="M0 -1 C-3 -6 -2 -11 0 -16 C2 -11 3 -6 0 -1Z" fill="#fffbe0"/></g></g>
        <circle class="puff a" cx="0" cy="-8" r="5" fill="#d9cdd3"/><circle class="puff b" cx="3" cy="-8" r="4" fill="#d9cdd3"/></g>
    </svg>
  </div>
  <p class="cake-text" id="cakeText"></p>
  <p class="cake-sub" id="cakeSub"></p>
  <div class="meter" id="meter" hidden><i id="meterBar"></i></div>
  <button class="cake-skip" id="cakeSkip" hidden>Mic not working? Tap here</button>
</div>

<div class="card" id="card">
  <h1 id="title"></h1>
  <p id="text"></p>
  <p class="sig" id="sig"></p>
  <button id="close">Close</button>
</div>

<script>
// ✏️ CHANGE YOUR BIRTHDAY MESSAGES HERE (each leaf shows the next one in the list)
const MESSAGES = [
  { title: "Happy Birthday!",
    text: "Sana ma-enjoy mo yung day mo today at makapagpahinga ka rin kahit papaano. Huwag mo masyadong i-pressure yung sarili mo sa lahat ng bagay, take it one step at a time lang.\n\nSana maging okay na rin lahat soon, at mas marami pang happy days na dumating sa’yo. Enjoy your day and take care always!",
    sig: "" }
];

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
const hint = document.getElementById("hint"), card = document.getElementById("card");
const TAU = Math.PI * 2;
const isTouch = matchMedia("(pointer: coarse)").matches;
let W, H, DPR, bgCanvas;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => .5 - Math.cos(Math.PI * t) / 2;
const easeBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---- Sprites: flower heads are drawn once, then just stamped every frame (much faster on phones)
const SPR_R = 40, SPR_SIZE = 150, sprites = {};
function drawHead(c, type, R) {
  if (type === "daisy") {
    c.fillStyle = "#fff";
    for (let i = 0; i < 14; i++) { c.save(); c.rotate(i / 14 * TAU); c.beginPath(); c.ellipse(0, -R*.62, R*.2, R*.42, 0, 0, TAU); c.fill(); c.restore(); }
    c.fillStyle = "#f5b82e"; c.beginPath(); c.arc(0, 0, R*.3, 0, TAU); c.fill();
  } else if (type === "sunflower") {
    c.fillStyle = "#f7c316";
    for (let ring = 0; ring < 2; ring++) for (let i = 0; i < 22; i++) {
      c.save(); c.rotate((i + ring * .5) / 22 * TAU); c.beginPath();
      c.moveTo(-R*.15, -R*.4); c.lineTo(0, -R*(1.05 - ring*.08)); c.lineTo(R*.15, -R*.4); c.fill(); c.restore();
    }
    const g = c.createRadialGradient(0, 0, 0, 0, 0, R*.5); g.addColorStop(0, "#7a4a1d"); g.addColorStop(1, "#3b2210");
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, R*.48, 0, TAU); c.fill();
  } else if (type === "tulip") {
    c.translate(0, -R*.2);
    const g = c.createLinearGradient(0, -R, 0, R*.6); g.addColorStop(0, "#ff7ab5"); g.addColorStop(1, "#e0246f");
    c.fillStyle = g; c.beginPath(); c.moveTo(-R*.55, -R*.45);
    c.bezierCurveTo(-R*.6, R*.45, R*.6, R*.45, R*.55, -R*.45);
    c.lineTo(R*.3, -R*.95); c.quadraticCurveTo(R*.12, -R*.5, 0, -R*.55);
    c.quadraticCurveTo(-R*.12, -R*.5, -R*.3, -R*.95); c.closePath(); c.fill();
  } else {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, R*1.6);
    g.addColorStop(0, "rgba(255,40,40,1)"); g.addColorStop(.52, "rgba(238,17,17,1)");
    g.addColorStop(.58, "rgba(238,17,17,.45)"); g.addColorStop(1, "rgba(238,17,17,0)");
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, R*1.6, 0, TAU); c.fill();
  }
}
function buildSprites() {
  for (const t of ["daisy", "sunflower", "tulip", "poppy"]) {
    const s = document.createElement("canvas"); s.width = s.height = SPR_SIZE * DPR;
    const c = s.getContext("2d"); c.scale(DPR, DPR); c.translate(SPR_SIZE / 2, SPR_SIZE / 2);
    drawHead(c, t, SPR_R); sprites[t] = s;
  }
}

// ---- Static background drawn once per resize
const stars = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + .6, p: Math.random() * 6 }));
function buildBg() {
  bgCanvas = document.createElement("canvas"); bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
  const c = bgCanvas.getContext("2d"); c.scale(DPR, DPR);
  const g = c.createRadialGradient(W/2, H*.75, 0, W/2, H*.75, Math.max(W, H) * .8);
  g.addColorStop(0, "#3a0d1c"); g.addColorStop(1, "#14050b"); c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, isTouch ? 2 : 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); buildBg(); buildSprites();
}
resize(); addEventListener("resize", resize);

// ---- Sparkles
const sparks = [], MAX_SPARKS = 80, SPARK_COLS = ["#ffffff", "#ffd1e0", "#ffe27a", "#ff8fb1"];
function burst(x, y, n = 14) {
  for (let i = 0; i < n && sparks.length < MAX_SPARKS; i++) {
    const a = Math.random() * TAU, sp = 30 + Math.random() * 90;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: 1, c: SPARK_COLS[i % 4] });
  }
}

// ---- Flowers
const flowers = [];
let bag = [], msgCount = 0, phase = 0;
const nextType = () => { if (!bag.length) bag = ["daisy", "sunflower", "tulip", "poppy"].sort(() => Math.random() - .5); return bag.pop(); };

function plant(x, y) {
  y = clamp(y, 120, H - 110);
  const bx = W / 2 + (Math.random() - .5) * Math.min(180, W * .3), by = H + 8;
  flowers.push({
    bx, by, hx: x, hy: y,
    cx: (bx + x) / 2 + (Math.random() - .5) * 160, cy: (by + y) / 2 + (Math.random() - .5) * 40,
    type: nextType(), R: (Math.min(W, H) / 15 + 10) * (.85 + Math.random() * .3),
    born: performance.now() / 1000, g: 0, b: 0, burst: false,
    leaves: [{ t: .32, side: -1, msg: msgCount++, seen: false }, { t: .58, side: 1, msg: msgCount++, seen: false }]
  });
}
const pt = (f, t) => { const u = 1 - t; return [u*u*f.bx + 2*u*t*f.cx + t*t*f.hx, u*u*f.by + 2*u*t*f.cy + t*t*f.hy]; };
const tan = (f, t) => { const u = 1 - t; return Math.atan2(2*u*(f.cy - f.by) + 2*t*(f.hy - f.cy), 2*u*(f.cx - f.bx) + 2*t*(f.hx - f.cx)); };

function leaf(f, l, now) {
  const lg = easeOut(clamp((f.g - l.t) / .25));
  l.hit = null; if (lg <= 0) return;
  const [px, py] = pt(f, l.t), ang = tan(f, l.t) + l.side * 1.0;
  const Lm = Math.max(34, Math.min(72, f.R * 2)), L = Lm * lg, w = L * .4;
  const pulsing = !l.seen && lg > .95 && f.b > .8;
  const pulse = pulsing ? 1 + .1 * Math.sin(now * 5) : 1;
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.scale(pulse, pulse);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(L*.5, -w, L, 0); ctx.quadraticCurveTo(L*.5, w, 0, 0);
  if (pulsing) { ctx.lineWidth = 7; ctx.strokeStyle = "rgba(150,255,170,.22)"; ctx.stroke(); }
  ctx.fillStyle = "#3f9a4e"; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(160,235,170,.5)"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L*.9, 0); ctx.stroke();
  ctx.restore();
  if (lg > .9 && f.b > .5) l.hit = { x: px + Math.cos(ang) * Lm * .5, y: py + Math.sin(ang) * Lm * .5, r: Math.max(Lm * .5, 30) };
}

let last = performance.now();
function frame(ms) {
  const now = ms / 1000, dt = Math.min((ms - last) / 1000, .05); last = ms;
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  ctx.fillStyle = "#ffd9e4";
  for (const s of stars) {
    ctx.globalAlpha = .2 + .4 * (.5 + .5 * Math.sin(now * 1.5 + s.p));
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  for (const f of flowers) {
    const age = Math.max(0, now - f.born);
    f.g = easeInOut(clamp(age / 1.8));
    f.b = age > 1.5 ? easeBack(clamp((age - 1.5) / 1.2)) : 0;
    if (age > 1.5 && !f.burst) { f.burst = true; burst(f.hx, f.hy); }

    ctx.beginPath(); ctx.moveTo(f.bx, f.by);
    for (let i = 1; i <= 24; i++) { const p = pt(f, i / 24 * f.g); ctx.lineTo(p[0], p[1]); }
    ctx.strokeStyle = "#4a9e55"; ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.stroke();

    for (const l of f.leaves) leaf(f, l, now);

    if (f.b > 0) {
      const k = f.R / SPR_R * f.b, sway = Math.sin(now * 1.3 + f.bx) * .04;
      ctx.save(); ctx.translate(f.hx, f.hy); ctx.rotate(sway + (1 - Math.min(f.b, 1)) * -.6); ctx.scale(k, k);
      ctx.drawImage(sprites[f.type], -SPR_SIZE / 2, -SPR_SIZE / 2, SPR_SIZE, SPR_SIZE);
      ctx.restore();
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life -= dt * .9; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  if (cakeState === "lit" && micOk) tickBlow(dt);
  if (phase === 1 && flowers.length && flowers[0].b > .95) setHint("✿ Now touch a leaf 🍃 ✿", 2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setHint(t, p) { if (p && phase >= p) return; if (p) phase = p; hint.textContent = t; hint.style.opacity = .7; }
function leafAt(x, y) {
  for (let i = flowers.length - 1; i >= 0; i--) for (const l of flowers[i].leaves)
    if (l.hit && Math.hypot(x - l.hit.x, y - l.hit.y) < l.hit.r) return l;
  return null;
}
function showCard(l) {
  const m = MESSAGES[l.msg % MESSAGES.length];
  document.getElementById("title").textContent = m.title;
  document.getElementById("text").textContent = m.text;
  document.getElementById("sig").textContent = m.sig;
  card.classList.add("show"); l.seen = true; burst(l.hit.x, l.hit.y, 20);
  hint.style.opacity = 0; if (phase < 3) phase = 3;
}
function hideCard() { card.classList.remove("show"); setHint("✿ Plant more flowers 🌸 ✿"); }

// ---- Cake + blow-out-the-candle (microphone)
const layer = document.getElementById("cakeLayer"), wrap = document.getElementById("cakeWrap"), cakeEl = document.getElementById("cake");
const cakeText = document.getElementById("cakeText"), cakeSub = document.getElementById("cakeSub"), skipBtn = document.getElementById("cakeSkip");
let cakeState = "idle", pendingLeaf = null, skipTimer = null;
const song = document.getElementById("song");
let micStream = null, audioCtx = null, analyser = null, micBuf = null, micOk = false, micFailed = false;
const meter = document.getElementById("meter"), meterBar = document.getElementById("meterBar");
let calib = { t: 0, sum: 0, n: 0, base: .02 }, blowAcc = 0, lean = 0;

function updateSub() {
  if (cakeState !== "lit") return;
  cakeSub.textContent = micOk ? "Blow into your mic"
    : micFailed ? (window.isSecureContext ? "Mic is off. Tap the button below." : "Mic needs https or localhost. Tap the button below.")
    : "Allow the microphone, then blow on it";
}
async function startMic() {
  micOk = micFailed = false;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC(); if (audioCtx.resume) audioCtx.resume();      // created inside the tap on purpose
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no mic api");
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    if (audioCtx.state !== "running") await audioCtx.resume();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    micBuf = new Uint8Array(analyser.fftSize);
    calib = { t: 0, sum: 0, n: 0, base: .02 }; blowAcc = 0; lean = 0; micOk = true;
    meter.hidden = false;
  } catch (e) { console.warn("Mic error:", e); micFailed = true; skipBtn.hidden = false; }
  updateSub();
}
function stopMic() {
  micOk = false;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close().catch(() => {});
  micStream = audioCtx = analyser = null;
}
function tickBlow(dt) {
  analyser.getByteTimeDomainData(micBuf);
  let sum = 0; for (let i = 0; i < micBuf.length; i++) { const v = (micBuf[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / micBuf.length);
  if (calib.t < .5) { calib.t += dt; calib.sum += rms; calib.n++; calib.base = Math.min(.12, calib.sum / calib.n); return; }
  const over = rms > calib.base + .035;
  if (!over) calib.base += (rms - calib.base) * Math.min(1, dt * 1.5);   // floor follows the song / room noise
  blowAcc = over ? blowAcc + dt : Math.max(0, blowAcc - dt * 1.5);
  lean += (clamp((rms - calib.base) / .25) - lean) * Math.min(1, dt * 12);
  cakeEl.style.setProperty("--lean", lean.toFixed(3));
  meterBar.style.width = Math.round(clamp(blowAcc / .35) * 100) + "%";
  if (blowAcc > .35) extinguish();
}
function openCake(l) {
  cakeState = "drop"; pendingLeaf = { msg: l.msg, hit: { x: l.hit.x, y: l.hit.y }, seen: true }; l.seen = true;
  hint.style.opacity = 0; skipBtn.hidden = true; meter.hidden = true; meterBar.style.width = "0%"; cakeSub.textContent = ""; cakeText.textContent = "Make a wish";
  cakeEl.classList.remove("lit", "out"); cakeEl.style.setProperty("--lean", 0);
  wrap.classList.remove("away"); layer.classList.remove("fade"); layer.classList.add("show");
  startMic();                                   // must run inside the tap so the browser allows the mic prompt
  song.currentTime = 0; song.volume = .3;       // song starts with the cake, quieter so the mic hears the blow, not the music
  song.play().catch(() => {});
  setTimeout(() => {
    if (cakeState !== "drop") return;
    cakeState = "lit"; cakeEl.classList.add("lit"); cakeText.textContent = "Blow out the candle"; updateSub();
    skipTimer = setTimeout(() => { if (cakeState === "lit") skipBtn.hidden = false; }, 8000);
  }, 1500);
}
function extinguish() {
  if (cakeState !== "lit") return;
  cakeState = "out"; clearTimeout(skipTimer); stopMic();
  fadeSongUp();
  cakeEl.classList.add("out"); cakeEl.style.setProperty("--lean", 0);
  cakeText.textContent = ""; cakeSub.textContent = ""; skipBtn.hidden = true; meter.hidden = true;
  setTimeout(() => { wrap.classList.add("away"); layer.classList.add("fade"); }, 1200);
  setTimeout(() => { layer.classList.remove("show"); cakeState = "idle"; showCard(pendingLeaf); }, 1750);
}
skipBtn.addEventListener("click", extinguish);
function fadeSongUp() {
  const t = setInterval(() => { song.volume = Math.min(1, song.volume + .1); if (song.volume >= 1) clearInterval(t); }, 120);
}


let ignoreClick = false;
cv.addEventListener("click", e => {
  if (ignoreClick) { ignoreClick = false; return; }
  if (cakeState !== "idle" || card.classList.contains("show")) return;
  const l = leafAt(e.clientX, e.clientY); if (l) openCake(l);
});
cv.addEventListener("pointerdown", e => {
  ignoreClick = false;
  if (cakeState !== "idle") return;
  if (card.classList.contains("show")) { hideCard(); ignoreClick = true; return; }
  const l = leafAt(e.clientX, e.clientY);
  if (l) return;                       // leaf taps are handled in the click handler above
  plant(e.clientX, e.clientY);
  if (phase === 0) { phase = 1; hint.style.opacity = 0; }
});
cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") cv.style.cursor = leafAt(e.clientX, e.clientY) ? "pointer" : "crosshair"; });
document.getElementById("close").addEventListener("click", hideCard);
document.addEventListener("visibilitychange", () => { last = performance.now(); });
</script>
